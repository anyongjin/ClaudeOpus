# Adapt the hostname and existing certificate paths before installation.
# TCP 443 is independent of the HY2 listener on UDP 443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name probe.example.com;
    ssl_certificate /etc/letsencrypt/live/probe.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/probe.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/chain-probe.location.conf;
    location / { return 404; }
}
